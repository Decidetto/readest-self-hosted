name: Selfhost Safety

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - selfhost-main
  pull_request:
    branches:
      - main
      - selfhost-main

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run public fork safety scan
        run: bash scripts/scan-public-fork-safety.sh
