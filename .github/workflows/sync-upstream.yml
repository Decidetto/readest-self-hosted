name: Sync Upstream Selfhost

on:
  workflow_dispatch:
  schedule:
    - cron: '37 3 * * *'

permissions:
  contents: write

concurrency:
  group: sync-upstream-selfhost
  cancel-in-progress: false

jobs:
  merge-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream main
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/readest/readest.git
          git fetch --no-recurse-submodules upstream main --tags
          git checkout main
          git merge --no-edit upstream/main

      - name: Update submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Setup app vendors
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: Typecheck selfhost client
        run: |
          cd apps/readest-app
          pnpm exec tsgo --noEmit

      - name: Test selfhost client config
        run: |
          cd apps/readest-app
          tests=(
            src/__tests__/services/customServerConfig.test.ts
            src/__tests__/services/environment.test.ts
            src/__tests__/helpers/auth.test.ts
            src/__tests__/helpers/updater.test.ts
            src/__tests__/libs/sync.test.ts
            src/__tests__/services/command-registry-extended.test.ts
          )
          pnpm exec vitest run "${tests[@]}"

      - name: Run public fork safety scan
        run: bash scripts/scan-public-fork-safety.sh

      - name: Push synchronized branches
        run: git push --atomic origin HEAD:main HEAD:selfhost-main
